name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4.10" # declared floor (Gemfile ruby >= 3.4.10)
          - "3.4.12" # latest 3.4 patch release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Semgrep CE
        run: pipx install semgrep==1.183.0

      - name: Run checks (tests, rubocop, bundler-audit, flay report, semgrep)
        env:
          SEMGREP_REQUIRED: "1"
          # Runner images include Node.js; fail instead of falling back to
          # the static-only UI ordering assertions when it is missing.
          NODE_REQUIRED: "1"
        run: bundle exec rake check

      # Tokenless upload works for public repos; a private repo needs a
      # CODECOV_TOKEN repository secret. Non-blocking during alpha.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/.resultset.json
          fail_ci_if_error: false

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Generate coverage and lint reports
        run: |
          bundle exec rake test
          bundle exec rubocop --format json --out coverage/rubocop.json

      # Self-skips until SONAR_TOKEN is added to the repository secrets;
      # requires Automatic Analysis to stay disabled for the project on
      # sonarcloud.io (the scanner rejects the upload otherwise).
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
