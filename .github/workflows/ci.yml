name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4.10" # declared floor (Gemfile ruby >= 3.4.10)
          - "3.4.11" # latest 3.4 patch release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Semgrep CE
        run: pipx install semgrep==1.180.0

      - name: Run checks (tests, rubocop, bundler-audit, flay report, semgrep)
        env:
          SEMGREP_REQUIRED: "1"
          # Runner images include Node.js; fail instead of falling back to
          # the static-only UI ordering assertions when it is missing.
          NODE_REQUIRED: "1"
        run: bundle exec rake check

      # Tokenless upload works for public repos; a private repo needs a
      # CODECOV_TOKEN repository secret. Non-blocking during alpha.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/.resultset.json
          fail_ci_if_error: false

  # No CI sonar job: the project uses SonarCloud Automatic Analysis, which
  # conflicts with CI-based scanning. sonar-project.properties remains for
  # manual/local sonar-scanner runs.
