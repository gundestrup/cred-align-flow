# Semgrep configuration — local rules only
#
# Run: semgrep scan --config .semgrep.yml --metrics off --error lib/ bin/ Rakefile
#
# No registry packs (p/*): this repo is public so Pro rules would be
# licensed, but fetching them needs a SEMGREP_APP_TOKEN and makes the
# scan network-dependent. Rules live in this file; nothing is uploaded
# or fetched at scan time. See engineering-memory/tools/semgrep.md.

rules:
  # Detect String#scan with unanchored polynomial regex (ReDoS).
  # Excludes StringScanner#scan, which advances positionally and cannot backtrack.
  - id: ruby-redos-string-scan
    languages: [ruby]
    severity: WARNING
    message: "String#scan with unanchored polynomial regex may cause ReDoS"
    patterns:
      - pattern: $X.scan($REGEX)
      - pattern-not-regex: 'scanner\.scan\('
      - pattern-not: $X.scan("$LITERAL")
    options:
      symbolic_propagation: true
    metavariable-analysis:
      analyzer: redos
      metavariable: $REGEX

  # Detect use of eval with variable input.
  - id: ruby-eval-usage
    languages: [ruby]
    severity: ERROR
    message: "Use of eval() is dangerous — avoid dynamic code execution"
    pattern: eval($VAR)
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Code Injection"

  # Detect command injection via a single shell-string argument.
  # Array/env forms (Open3.capture3(env, "gh", *args)) are intentional
  # here — they bypass the shell and do not match this single-arg pattern.
  - id: ruby-command-injection
    languages: [ruby]
    severity: ERROR
    message: "Command execution with a shell-string argument — potential command injection"
    pattern-either:
      - pattern: system($CMD)
      - pattern: exec($CMD)
      - pattern: spawn($CMD)
      - pattern: IO.popen($CMD)
      - pattern: Open3.capture3($CMD)
      - pattern: Open3.capture2($CMD)
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78: OS Command Injection"
