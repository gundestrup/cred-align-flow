# SonarQube Cloud configuration.
#
# One-time service-side setup (cannot be done from the repo):
#   1. Import gundestrup/cred-align-flow at https://sonarcloud.io
#      and confirm the organization/project key below.
#   2. Add SONAR_TOKEN to the GitHub repository secrets.
# The CI `sonar` job self-skips while the token is absent.
#
# Imports the reports already produced by the toolchain:
#   - RuboCop JSON -> sonar.ruby.rubocop.reportPaths
#   - SimpleCov JSON -> sonar.ruby.coverage.reportPaths
#   - CPD duplication percentage is computed natively by the scanner.

sonar.organization=gundestrup
sonar.projectKey=gundestrup_cred-align-flow
sonar.projectName=cred-align-flow

# sources=lib,bin,test + test.inclusions is the portable form: the separate
# sonar.tests= root is silently ignored by current SonarQube Community Build
# (local ~/workspace/SonarQube instance) and sonar.sources=. + sonar.tests=
# fails outright on the scanner. config/** keeps the gitignored secrets dir
# out of scope even if sources is ever broadened.
sonar.sources=lib,bin,test
sonar.test.inclusions=test/**
sonar.exclusions=coverage/**/*,config/**/*

sonar.ruby.rubocop.reportPaths=coverage/rubocop.json
sonar.ruby.coverage.reportPaths=coverage/coverage.json
