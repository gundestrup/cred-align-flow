name: cred-align-flow-integration

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.9
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:${FORGEJO_PORT:-3300}/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 127.0.0.0/8,::1/128
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:${FORGEJO_PORT:-3300}:3000"
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  forgejo-data:
